<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inference and Explanation Interface</title>
    <style>
        :root {
            --bg: #0b0e14;
            --panel: #161b22;
            --accent: #58a6ff;
            --text: #c9d1d9;
            --card-inner: #21262d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none; /* Prevents text selection while resizing */
        }

        /* Main Layout */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            transition: opacity 0.3s;
        }

        /* Input Panel */
        .panel {
            background: var(--panel);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #30363d;
            height: fit-content;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        label { font-size: 11px; text-transform: uppercase; color: #8b949e; display: block; margin-bottom: 4px; }
        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid #30363d;
            color: white;
            padding: 8px;
            border-radius: 6px;
            box-sizing: border-box;
            user-select: text;
        }

        .btn-primary {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Output Area */
        .output-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .attribute-card {
            background: var(--panel);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: border-color 0.3s;
        }

        .attribute-card:hover { border-color: var(--accent); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .explain-btn {
            background: transparent;
            border: 1px solid #30363d;
            color: var(--accent);
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        .explain-btn:hover { background: rgba(88, 166, 255, 0.1); }

        .viz-box {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            margin-bottom: 10px;
        }

        /* SHAP Explainer Side Panel */
        .shap-drawer {
            position: relative;
            width: 0;
            background: var(--panel);
            border-left: 1px solid #30363d;
            /* Using transition only for closing, manual resize handles opening */
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: visible; /* Visible so resizer handle can be seen */
        }

        .shap-drawer.open { width: 500px; }

        /* Drag Handle for Resizing */
        .resizer {
            width: 6px;
            height: 100%;
            background: transparent;
            cursor: col-resize;
            position: absolute;
            left: -3px; /* Center over the border */
            top: 0;
            z-index: 100;
            transition: background 0.2s;
        }
        .resizer:hover { background: var(--accent); }

        .drawer-header {
            padding: 20px;
            background: #21262d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .shap-content {
            padding: 20px;
            overflow: auto;
            flex-grow: 1;
            cursor: zoom-in;
            transition: background 0.3s;
        }

        /* Fullscreen View for SVG */
        .shap-content.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            cursor: zoom-out;
        }

        .shap-content.fullscreen svg {
            max-width: 95%;
            max-height: 95%;
            width: auto !important;
            height: auto !important;
        }

        .badge {
            background: var(--card-inner);
            padding: 5px 10px;
            border-radius: 20px;
            font-family: monospace;
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="main-content" id="mainLayout">
    <div class="panel">
        <h2 style="margin-top:0">Model Inputs</h2>
        <div class="input-grid">
            <div><label>Self X</label><input type="number" id="sx" value="1.2"></div>
            <div><label>Self Y</label><input type="number" id="sy" value="0.0"></div>
            <div><label>Self VX</label><input type="number" id="svx" value="5.5"></div>
            <div><label>Self VY</label><input type="number" id="svy" value="0.0"></div>
            <div><label>Enemy X</label><input type="number" id="ex" value="-4.0"></div>
            <div><label>Enemy Y</label><input type="number" id="ey" value="0.0"></div>
            <div><label>Enemy VX</label><input type="number" id="evx" value="2.0"></div>
            <div><label>Enemy VY</label><input type="number" id="evy" value="0.0"></div>
        </div>
        <button class="btn-primary" onclick="predict()">Run Inference</button>
    </div>

    <div class="output-grid">
        <div class="attribute-card">
            <div class="card-header">
                <label>Is Flipped</label>
                <button class="explain-btn" onclick="explain('isFlipped')">Explain</button>
            </div>
            <div id="res-flip" class="badge" style="font-size: 1.5rem;">-</div>
        </div>

        <div class="attribute-card">
            <div class="card-header">
                <label>Current Move</label>
                <button class="explain-btn" onclick="explain('move')">Explain</button>
            </div>
            <div id="res-move" class="badge" style="font-size: 1.2rem;">-</div>
        </div>

        <div class="attribute-card">
            <div class="card-header">
                <label>Knockback Power</label>
                <button class="explain-btn" onclick="explain('kb_power')">Explain</button>
            </div>
            <div class="viz-box">
                <canvas id="canvas-kb-p" width="100" height="40"></canvas>
            </div>
            <div id="res-kb-p" class="badge">0.0</div>
        </div>

        <div class="attribute-card">
            <div class="card-header">
                <label>Knockback Direction</label>
                <button class="explain-btn" onclick="explain('kb_direction')">Explain</button>
            </div>
            <div class="viz-box">
                <canvas id="canvas-kb-d" width="60" height="60"></canvas>
            </div>
        </div>

        <div class="attribute-card">
            <div class="card-header">
                <label>Jump Power</label>
                <button class="explain-btn" onclick="explain('jump_power')">Explain</button>
            </div>
            <div class="viz-box">
                <canvas id="canvas-jump-p" width="100" height="40"></canvas>
            </div>
            <div id="res-jump-p" class="badge">0.0</div>
        </div>

        <div class="attribute-card">
            <div class="card-header">
                <label>Jump Direction</label>
                <button class="explain-btn" onclick="explain('jump_direction')">Explain</button>
            </div>
            <div class="viz-box">
                <canvas id="canvas-jump-d" width="60" height="60"></canvas>
            </div>
        </div>
    </div>
</div>

<div id="drawer" class="shap-drawer">
    <div class="resizer" id="dragHandle"></div>
    <div class="drawer-header">
        <span id="drawer-title" style="font-weight: bold;">SHAP Waterfall</span>
        <button class="explain-btn" onclick="closeDrawer()">Close</button>
    </div>
    <div id="shap-placeholder" class="shap-content" title="Click to expand/collapse">
        <p style="color: #8b949e;">Loading analysis...</p>
    </div>
</div>

<script>
    let indicies = {};
    const drawer = document.getElementById('drawer');
    const dragHandle = document.getElementById('dragHandle');
    const shapPlaceholder = document.getElementById('shap-placeholder');
    let isResizing = false;

    // --- Resizing Logic ---
    dragHandle.addEventListener('mousedown', (e) => {
        isResizing = true;
        // Temporarily disable transition during drag for smoothness
        drawer.style.transition = 'none';
        document.body.style.cursor = 'col-resize';
    });

    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        
        // Calculate new width: Screen width minus mouse X position
        let newWidth = window.innerWidth - e.clientX;
        
        // Constraints
        if (newWidth < 200) newWidth = 0; // Snap closed
        if (newWidth > window.innerWidth * 0.9) newWidth = window.innerWidth * 0.9;
        
        drawer.style.width = `${newWidth}px`;
    });

    document.addEventListener('mouseup', () => {
        if (isResizing) {
            isResizing = false;
            drawer.style.transition = 'width 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
            document.body.style.cursor = 'default';
        }
    });

    // --- Fullscreen Logic ---
    shapPlaceholder.addEventListener('click', () => {
        // Toggle fullscreen class if there's an SVG loaded
        if (shapPlaceholder.querySelector('svg')) {
            shapPlaceholder.classList.toggle('fullscreen');
        }
    });

    async function predict() {
        const inputs = ['sx','sy','svx','svy','ex','ey','evx','evy'].map(id => parseFloat(document.getElementById(id).value));
        const res = await fetch('/predict', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({data: inputs})
        });
        const data = await res.json();

        document.getElementById('res-flip').innerText = data.isFlipped ? "TRUE" : "FALSE";
        document.getElementById('res-move').innerText = data.move;
        document.getElementById('res-kb-p').innerText = data.kb_power.toFixed(3);
        document.getElementById('res-jump-p').innerText = data.jump_power.toFixed(3);
        indicies["move"] = data.move_index;
        indicies["isFlipped"] = data.isFlippedIndex;

        drawDirection('canvas-kb-d', data.kb_direction, false);
        drawDirection('canvas-jump-d', data.jump_direction, true);
        drawPower('canvas-kb-p', data.kb_power);
        drawPower('canvas-jump-p', data.jump_power);
    }

    async function explain(attr) {
        const content = document.getElementById('shap-placeholder');
        document.getElementById('drawer-title').innerText = "Analyzing: " + attr;
        
        // Open drawer to default width if currently closed
        if (parseInt(getComputedStyle(drawer).width) === 0) {
            drawer.classList.add('open');
            // Remove the hardcoded 'open' class width after transition to allow manual resizing
            setTimeout(() => {
                const currentWidth = drawer.offsetWidth;
                drawer.classList.remove('open');
                drawer.style.width = `${currentWidth}px`;
            }, 300);
        }
        
        content.innerHTML = "<p style='color: #8b949e;'>Generating SHAP waterfall plots...</p>";

        const inputs = ['sx','sy','svx','svy','ex','ey','evx','evy'].map(id => parseFloat(document.getElementById(id).value));
        const res = await fetch('/explain', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({data: inputs, target: attr, index: indicies[attr] ?? 0})
        });
        
        const svg = await res.text();
        content.innerHTML = svg;
    }

    function closeDrawer() {
        drawer.style.width = "0";
        // Reset classes
        drawer.classList.remove('open');
        shapPlaceholder.classList.remove('fullscreen');
    }

    function drawDirection(canvasId, rad, isHalf) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,60,60);
        ctx.strokeStyle = '#30363d';
        ctx.beginPath();
        ctx.arc(30,30,25, isHalf?Math.PI:0, isHalf?0:Math.PI*2);
        ctx.stroke();
        
        ctx.strokeStyle = '#58a6ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(30,30);
        ctx.lineTo(30 + Math.cos(rad)*25, 30 - Math.sin(rad)*25);
        ctx.stroke();
    }

    function drawPower(canvasId, val) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,100,40);
        ctx.fillStyle = '#30363d';
        ctx.fillRect(0, 15, 100, 10);
        ctx.fillStyle = '#58a6ff';
        ctx.fillRect(0, 15, Math.min(val*100, 100), 10);
    }
</script>

</body>
</html>
